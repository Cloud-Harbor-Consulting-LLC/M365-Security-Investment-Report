<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The only origins reachable from this page are Microsoft's own: Entra to sign in,
         Graph to read. There is no backend of ours, so there is nowhere else for tenant
         data to go, and this policy is what makes that claim enforceable rather than a
         promise. connect-src covers the Graph GETs; frame-src covers MSAL's silent-renew
         iframe; form-action covers the sign-in POST back to Entra. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               img-src 'self' data:;
               font-src 'self';
               style-src 'self' 'unsafe-inline';
               connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com;
               frame-src https://login.microsoftonline.com;
               form-action 'self' https://login.microsoftonline.com;
               object-src 'none';
               base-uri 'none'"
    />

    <title>M365 Security Investment Report</title>
    <meta
      name="description"
      content="Read-only Microsoft 365 spend-realization reporting. See how much of the security capability you already pay for is actually switched on."
    />
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
