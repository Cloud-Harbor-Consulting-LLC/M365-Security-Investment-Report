<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />

    <!--
      A real title, because the browser shows it while this page is open and the URL at
      that moment contains an authorization code. "Signing in" is what a person should
      see, not a query string.
    -->
    <title>Signing in</title>

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #525e67;
        background: #f3f6f9;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #a4b0ba; background: #12171a; }
      }
    </style>
  </head>
  <body>
    <p>Completing sign-in…</p>
    <script type="module" src="/src/redirect.ts"></script>
  </body>
</html>
