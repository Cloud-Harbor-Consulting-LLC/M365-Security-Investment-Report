name: Deploy app to Azure Static Web Apps

# Production deploys on merge to main. Each pull request that touches the app gets its own
# preview address, posted as a comment, and the preview is removed when the pull request
# closes. GitHub Pages keeps deploying alongside this until the move is complete.
#
# The address and custom domain live in Azure, never in this file, so a fork inherits
# neither. Without the deployment token (a fork, or a Dependabot pull request) the app is
# still built and tested, and the deploy step is skipped.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/CloudHarbor.M365SecurityInvestment/Data/**'
      - 'tests/fixtures/**'
      - '.github/workflows/swa.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'app/**'
      - 'src/CloudHarbor.M365SecurityInvestment/Data/**'
      - 'tests/fixtures/**'
      - '.github/workflows/swa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # The deploy action comments the preview address on the pull request.

# One deployment per target at a time, and never cancel one midway.
concurrency:
  group: swa-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # Same gate as the Pages deploy: the engine must agree with PowerShell to the cent.
      - name: Engine parity tests
        working-directory: app
        run: npm test

      # Served from the root of its own host, unlike the Pages project site.
      - name: Build
        working-directory: app
        env:
          VITE_BASE: /
        run: npm run build

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: main
          # Already built and tested above, so upload the output as it is.
          app_location: app/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          # The headers. Kept beside the app source rather than in the build output, so
          # the GitHub Pages copy does not publish it.
          config_file_location: app

      - name: No deployment token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No deployment token is available to this run, so the app was built and tested but not deployed."

  close:
    name: Remove preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Remove preview
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''
